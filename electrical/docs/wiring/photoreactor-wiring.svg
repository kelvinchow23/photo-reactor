<text x="46" y="800" xml:space="preserve" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#182b45">7  Fan +5 V         8  Ground</text>
<text x="46" y="828" xml:space="preserve" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#182b45">9  Stir PWM       10  Cool PWM</text>
<text x="46" y="856" xml:space="preserve" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#182b45"></text>
<text x="46" y="884" xml:space="preserve" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#182b45">All ten pins connect straight-through.</text>
<text x="46" y="912" xml:space="preserve" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#182b45">LED − is NOT ground.</text>
<rect x="490" y="660" width="520" height="335" rx="10" fill="#fff1d9" stroke="#d1d9e6"/>
