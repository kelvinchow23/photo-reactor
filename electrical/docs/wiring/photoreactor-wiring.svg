<text x="506" y="744" xml:space="preserve" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#182b45">1  LED B +       →    1</text>
<text x="506" y="772" xml:space="preserve" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#182b45">2  LED B −       →    2</text>
<text x="506" y="800" xml:space="preserve" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#182b45">3  Fan +5 V      →    7</text>
<text x="506" y="828" xml:space="preserve" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#182b45">4  Ground        →    8</text>
<text x="506" y="856" xml:space="preserve" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#182b45">5  Cool tach     →    5</text>
<text x="506" y="884" xml:space="preserve" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#182b45">6  Cool PWM    →    9</text>
<text x="506" y="912" xml:space="preserve" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#182b45">Leave second J1 pins 3, 4, 6, 10 unwired.</text>
