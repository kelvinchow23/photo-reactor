<text x="46" y="688" xml:space="preserve" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#182b45">CABLE A • 10-PIN PINOUT</text>
<text x="46" y="716" xml:space="preserve" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#182b45">1  LED A +          2  LED A −</text>
